name: Sports HQ run

# Actions cron is UTC and ignores DST, so the 10-minute schedules cover broad game-day windows in
# both CDT and CST; shq/run.py decides from real ESPN kickoff times whether the injury watch is
# active. The hourly schedule keeps lineups fresh, builds the Tuesday 7am CT Weekly tab, and (with
# the commit every run makes) keeps scheduled workflows from auto-disabling.
on:
  schedule:
    - cron: "*/10 11-23 * * 0"        # Sun: London 8:30a CT kickoff -2h through SNF
    - cron: "*/10 0-4 * * 1"          # Sun night (UTC Mon) SNF
    - cron: "*/10 21-23 * * 1"        # Mon: MNF windows
    - cron: "*/10 0-4 * * 2"          # Mon night (UTC Tue)
    - cron: "*/10 14-23 * * 4"        # Thu: Thanksgiving early games + TNF
    - cron: "*/10 0-4 * * 5"          # Thu night (UTC Fri)
    - cron: "*/10 15-23 * * 5,6"      # Fri (Black Friday/Christmas) + Sat (late-season Saturdays)
    - cron: "*/10 0-4 * * 6,0"        # Fri/Sat nights (UTC Sat/Sun)
    - cron: "*/30 20-23,0-3 * * *"    # every evening: NBA tip-offs (6pm-10pm CT)
    - cron: "*/20 13-14 * * *"        # daily 8am CT digest (13 UTC in CDT, 14 UTC in CST)
    - cron: "7 * * * *"               # hourly everywhere else
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Yahoo writes, no pushes)"
        type: boolean
        default: false
      force_weekly:
        description: "Rebuild the Weekly tab now"
        type: boolean
        default: false
      force_digest:
        description: "Rebuild the Today digest now (pushes if something needs fixing)"
        type: boolean
        default: false
      force_wrapup:
        description: "Build the weekend wrap-up now (Sunday edition mid-week, else last week's final) and push it"
        type: boolean
        default: false
      test_push:
        description: "Send a test push"
        type: boolean
        default: false
      handoff:
        description: "Started by a loop that hit its time limit (skips the 'another run is looping' check)"
        type: boolean
        default: false
      loop_minutes:
        description: "Testing only: end the loop after this many minutes (max 345)"
        type: number
        default: 345

permissions:
  contents: write
  actions: write    # the Run step checks whether another Sports HQ run is looping, and hands off to a new run (Q-037)

# Scheduled runs share one group (one running, one waiting). Each manual or laptop dispatch (ops/kick.ps1, Q-029) gets its
# own group so it starts at once instead of being replaced by the next queued cron; when another run is already looping
# it does one pass and stops.
concurrency:
  group: sports-hq-run-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'cron' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # a run keeps looping through game-day windows (see Run step)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache bucket (6h) for the Sleeper players dump
        id: bucket
        run: echo "key=$(date -u +%Y%m%d)-$(( 10#$(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sleeper-players-${{ steps.bucket.outputs.key }}
          restore-keys: sleeper-players-
      - name: Run (loops every 10 min while a watch window is open or near)
        id: run
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE_WEEKLY: ${{ inputs.force_weekly && '1' || '0' }}
          FORCE_DIGEST: ${{ inputs.force_digest && '1' || '0' }}
          FORCE_WRAPUP: ${{ inputs.force_wrapup && '1' || '0' }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '0' }}
          HANDOFF: ${{ inputs.handoff && '1' || '0' }}
          LOOP_MINUTES: ${{ inputs.loop_minutes || 345 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        # GitHub drops many scheduled triggers under load, so one run that starts carries the
        # whole window: pass, commit, then keep going every 10 min while shq.run says a watch
        # window is open or opens within 3h, up to ~5h45m (job limit is 6h). A loop that reaches that limit while the
        # window is still open starts its successor (handoff, Q-037), so the injury watch never sits idle mid-game.
        run: |
          set +e
          lm="$LOOP_MINUTES"; case "$lm" in ''|*[!0-9]*) lm=345 ;; esac; { [ "$lm" -lt 1 ] || [ "$lm" -gt 345 ]; } && lm=345
          end=$((SECONDS + lm*60)); failed=0; timed_out=0
          # another Sports HQ run has been going 10+ min, so it is looping (a one-pass run ends in ~5): one pass, no second loop.
          # A handoff run skips this: the loop that started it is still finishing.
          if [ "$HANDOFF" = 1 ]; then others=0; echo "handoff from a loop at its time limit: looping"; else
          others=$(gh run list --workflow run.yml --status in_progress --json databaseId,createdAt --jq             "[.[] | select(.databaseId != ${{ github.run_id }} and (.createdAt | fromdateiso8601) < (now - 600))] | length" 2>/dev/null || echo 0)
          fi
          [ "${others:-0}" -gt 0 ] && echo "another run is looping: one pass only"
          while :; do
            if ! python -m shq.run; then
              [ $failed -eq 0 ] && curl -s -H "Title: Sports HQ job failed" -H "Priority: 4" -H "Tags: x"                 -H "Click: $RUN_URL" -d "A Sports HQ pass failed. Tap for logs." "https://ntfy.sh/$NTFY_TOPIC" >/dev/null
              failed=1
            fi
            # Pool Picks stale-line scan: Wed-Sat every 2h (30 min before CFP's Sat lock); never fails the run
            (cd picks && python -m pp.lines --if-due) || echo "pick line scan failed"
            bash .github/commit_data.sh || failed=1
            export FORCE_WEEKLY=0 FORCE_DIGEST=0 FORCE_WRAPUP=0 TEST_PUSH=0
            [ "${others:-0}" -gt 0 ] && break
            python -m shq.run --keep-watching || break
            if [ $((SECONDS + 660)) -ge $end ]; then timed_out=1; break; fi
            # wake at :07/:17/:27… so a pass lands 3 min before kickoffs on :00/:05/:30 marks
            sleep $(( 600 - ($(date +%s) + 180) % 600 ))
          done
          # the watch window is still open but this job is near GitHub's 6-hour limit: start the next loop now (Q-037).
          # GitHub lets the built-in token start workflow_dispatch runs; a test run (loop_minutes) hands off a normal one.
          if [ $timed_out -eq 1 ]; then
            dr=false; [ "$DRY_RUN" = 1 ] && dr=true
            gh workflow run run.yml --ref "${{ github.ref_name }}" -f handoff=true -f dry_run=$dr && echo "handed off to a new run" || echo "handoff failed"
          fi
          exit $failed
      - name: Push alert on failure
        if: failure() && steps.run.outcome != 'failure'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: Sports HQ job failed" -H "Priority: 4" -H "Tags: x"             -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"             -d "Run ${{ github.run_number }} failed. Tap for logs." "https://ntfy.sh/$NTFY_TOPIC"
