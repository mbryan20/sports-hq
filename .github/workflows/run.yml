name: Sports HQ run

# Actions cron is UTC and ignores DST, so the 10-minute schedules cover broad game-day windows in
# both CDT and CST; shq/run.py decides from real ESPN kickoff times whether the injury watch is
# active. The hourly schedule keeps lineups fresh, builds the Tuesday 7am CT Weekly tab, and (with
# the commit every run makes) keeps scheduled workflows from auto-disabling.
on:
  schedule:
    - cron: "*/10 11-23 * * 0"        # Sun: London 8:30a CT kickoff -2h through SNF
    - cron: "*/10 0-4 * * 1"          # Sun night (UTC Mon) SNF
    - cron: "*/10 21-23 * * 1"        # Mon: MNF windows
    - cron: "*/10 0-4 * * 2"          # Mon night (UTC Tue)
    - cron: "*/10 14-23 * * 4"        # Thu: Thanksgiving early games + TNF
    - cron: "*/10 0-4 * * 5"          # Thu night (UTC Fri)
    - cron: "*/10 15-23 * * 5,6"      # Fri (Black Friday/Christmas) + Sat (late-season Saturdays)
    - cron: "*/10 0-4 * * 6,0"        # Fri/Sat nights (UTC Sat/Sun)
    - cron: "7 * * * *"               # hourly everywhere else
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Yahoo writes, no pushes)"
        type: boolean
        default: false
      force_weekly:
        description: "Rebuild the Weekly tab now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sports-hq-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache bucket (6h) for the Sleeper players dump
        id: bucket
        run: echo "key=$(date -u +%Y%m%d)-$(( $(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sleeper-players-${{ steps.bucket.outputs.key }}
          restore-keys: sleeper-players-
      - name: Run
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE_WEEKLY: ${{ inputs.force_weekly && '1' || '0' }}
        run: python -m shq.run
      - name: Commit data
        if: always()
        run: |
          git config user.name "sports-hq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state
          git commit -q -m "data: $(date -u +%FT%TZ)" || echo "nothing to commit"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
      - name: Push alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: Sports HQ job failed" -H "Priority: 4" -H "Tags: x" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Run ${{ github.run_number }} failed. Tap for logs." "https://ntfy.sh/$NTFY_TOPIC"
