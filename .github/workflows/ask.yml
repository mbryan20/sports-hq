name: Ask Claude

# A league page's "Ask Claude" box (docs/lib/move.js, Q-054) opens a pre-filled GitHub issue: label "ask",
# title "Ask: <league>: <question>". Claude answers it from Sports HQ's data, the War Room model and news under 48h
# (ops/tasks/ask-claude.md); the answer goes into docs/data/asks.json (shown under that league's box, a few minutes
# later) and on the issue, which is then closed. Runs only when Michael asks: no schedule.
# Public repo: the job runs only for an issue the owner opened himself (login + OWNER association + the "ask" label;
# never on comments or edits). Claude only reads, searches and writes .ask/answer.md; this workflow commits asks.json
# and posts the one comment (guardrails agreed with Claude Ops, Nov 11).
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`); without it the box answers "not set up yet".
# Re-ask (Nov 12): Actions > Ask Claude > Run workflow with an issue number answers that existing question again
# (same owner + "ask" label checks), e.g. after a failed run. No new public issue needed.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number of an existing Ask question to answer again"
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: ask
  cancel-in-progress: false

jobs:
  answer:
    if: >-
      (github.event_name == 'issues' && github.event.issue.user.login == 'mbryan20' && github.event.issue.author_association == 'OWNER' && contains(github.event.issue.labels.*.name, 'ask'))
      || (github.event_name == 'workflow_dispatch' && github.actor == 'mbryan20')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      N: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Load the issue (re-ask only)
        # same checks as a new issue: opened by mbryan20, labelled "ask"; its text goes to env vars, never the shell
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view "$N" -R "$GITHUB_REPOSITORY" --json number,createdAt,title,body,author,labels > .issue.json
          python - <<'EOF'
          import json, os, secrets
          i = json.load(open(".issue.json", encoding="utf-8"))
          assert i["author"]["login"] == "mbryan20", "not Michael's issue"
          assert any(l["name"] == "ask" for l in i["labels"]), "not an Ask question"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for k, v in (("ISSUE_NUMBER", str(i["number"])), ("ISSUE_CREATED", i["createdAt"]),
                           ("ISSUE_TITLE", i["title"]), ("ISSUE_BODY", i["body"] or "")):
                  d = "EOF_" + secrets.token_hex(8)
                  f.write(f"{k}<<{d}\n{v}\n{d}\n")
          EOF
      - name: Read the question
        # issue text only ever reaches the script through env vars, never the shell
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || env.ISSUE_NUMBER }}
          ISSUE_CREATED: ${{ github.event.issue.created_at || env.ISSUE_CREATED }}
          ISSUE_TITLE: ${{ github.event.issue.title || env.ISSUE_TITLE }}
          ISSUE_BODY: ${{ github.event.issue.body || env.ISSUE_BODY }}
        run: mkdir -p .ask && python -m shq.asks parse > .ask/question.json && cat .ask/question.json
      - name: Download screenshots
        # pasted into the issue: GitHub's image hosts only, at most 4, no token sent (shq/asks.py fetch_images)
        run: python -m shq.asks images .ask/question.json .ask/img
      - name: Claude answers
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Follow ops/tasks/ask-claude.md exactly. The question is in .ask/question.json (its image_files are his screenshots: read each one). Write the answer to .ask/answer.md.
          claude_args: >-
            --model claude-opus-5-5 --max-turns 40
            --allowedTools "Read,Write,Glob,Grep,WebSearch,WebFetch,Bash(node warroom/trymove.js:*)"
      - name: Not set up yet
        if: env.HAS_TOKEN != 'true'
        run: |
          printf '%s\n' "Claude can't answer here yet: Sports HQ's Ask box needs its one-time sign-in (the CLAUDE_CODE_OAUTH_TOKEN secret on GitHub). Try a move above works without it." > .ask/answer.md
      - name: Record the answer and commit
        # Record onto the newest asks.json each try (a re-run starts from an old checkout, and other answers may land
        # meanwhile), so asks.json never conflicts. Only asks.json is ever committed; no rebase.
        run: |
          git config user.name "sports-hq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git checkout -q -f -B ask-answer origin/main
            python -m shq.asks record .ask/question.json .ask/answer.md
            git add docs/data/asks.json
            git commit -q -m "Ask #$N answered" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - name: Answer on the issue and close it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { cat .ask/answer.md 2>/dev/null; printf '\n\n---\nAlso on the league page (Try a move · Ask Claude) in a minute or two.\n'; } > .ask/comment.md
          gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body-file .ask/comment.md
          gh issue close "$N" -R "$GITHUB_REPOSITORY"
      - name: Push alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: Ask Claude failed" -H "Priority: 3" -H "Tags: x" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Your Sports HQ question didn't get an answer. Tap for logs." "https://ntfy.sh/$NTFY_TOPIC"
