# Backup for the laptop's scheduled Claude runs: if a slot passes with no fresh card,
# build a model-only card from the committed slate + research and push it.
name: Picks backup cards
on:
  schedule:
    - cron: "45 3 * * 4"   # Wed 9pm CT slot (draft)
    - cron: "45 2 * * 5"   # Thu 8pm CT slot (BTO final)
    - cron: "45 3 * * 6"   # Fri 9pm CT slot (final)
    - cron: "45 14 * * 6"  # Sat 8am CT slot (refresh)
  workflow_dispatch:
    inputs:
      stage: {description: "draft|final|refresh", required: true, default: draft}
permissions:
  contents: write
concurrency: picks-cards
jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: picks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy requests
      # Fresh = the laptop posted after this slot opened (2h before the cron time); see pp/backup.py. A late run
      # (GitHub ran this 8h late on Nov 12) with fresh=1 builds nothing, pushes nothing and sends nothing.
      - name: Decide stage and whether the laptop already posted
        id: s
        env:
          SLOT: ${{ github.event.schedule }}
          STAGE_IN: ${{ github.event.inputs.stage }}
        run: |
          set -o pipefail
          python -m pp.backup decide --cron "$SLOT" --stage "$STAGE_IN" | tee -a "$GITHUB_OUTPUT"
      # No CFBD key here (Q-055): pp.http serves the saved CFBD copies of any age, and market.lines falls back to
      # the saved season lines + ESPN's scoreboard, so a missing key no longer kills the card.
      - name: Build backup card
        id: build
        if: steps.s.outputs.fresh == '0' || github.event_name == 'workflow_dispatch'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          BACKUP: "1"
        run: |
          set -o pipefail
          python -m pp.cards --stage ${{ steps.s.outputs.stage }} 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Commit, push, notify
        id: push
        if: steps.s.outputs.fresh == '0' || github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SLOT: ${{ github.event.schedule }}
        run: |
          # the laptop's card may have landed while this built: then leave it alone and say nothing
          git fetch -q origin main
          if [ "${{ github.event_name }}" = "schedule" ] && git show origin/main:picks/data/cards.json > "$RUNNER_TEMP/origin_cards.json" \
             && [ "$(python -m pp.backup fresh --cron "$SLOT" --cards "$RUNNER_TEMP/origin_cards.json")" = "1" ]; then
            echo "The laptop's card for this slot reached main while the backup built; not posting the backup."; exit 0
          fi
          git config user.name "pool-picks-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A -- . ../docs/picks && git commit -m "Picks backup card: ${{ steps.s.outputs.stage }}" && git pull --rebase && git push
          sleep 90
          curl -s -o /dev/null -H "Title: Picks BACKUP card posted" -H "Tags: warning" -H "Click: https://mbryan20.github.io/sports-hq/picks/" \
            -d "Laptop run missed; model-only card (no fresh injury research)." "https://ntfy.sh/$NTFY_TOPIC"
      # Plain words: "No picks card reached the site for the <slot> slot, and the backup couldn't build one: <reason>."
      # Never when the laptop's card for this slot was already on the site (fresh=1 on a scheduled run).
      - name: Notify on failure
        if: failure() && (steps.s.outputs.fresh != '1' || github.event_name == 'workflow_dispatch')
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SLOT: ${{ github.event.schedule }}
          STAGE_IN: ${{ github.event.inputs.stage }}
          OUTCOME_DECIDE: ${{ steps.s.outcome }}
          OUTCOME_BUILD: ${{ steps.build.outcome }}
          OUTCOME_PUSH: ${{ steps.push.outcome }}
        run: |
          msg=$(python3 -m pp.backup fail --cron "$SLOT" --stage "$STAGE_IN" --log "$RUNNER_TEMP/build.log") \
            || msg="No picks card reached the site for this slot, and the backup couldn't build one: the workflow failed before it could say why (tap for the log)."
          echo "$msg"
          curl -s -o /dev/null -H "Title: Picks backup failed" -H "Tags: x" -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "$msg" "https://ntfy.sh/$NTFY_TOPIC"
