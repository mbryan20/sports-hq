<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Players · Sports HQ</title>
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../lib/core.css">
<style>
/* Players: every player in a league, sortable and filterable. Basketball: data/players.json (shq/nba_values.py);
   football: data/players_nfl.json (shq/nfl_players.py). Dense on purpose:
   it replaces sifting players on FantasyPros. Phone: the table keeps the key columns and a category heat strip; tap a
   row for the full stat line. */
main { padding: 10px 12px 80px; max-width: 1400px; margin: 0 auto; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
.tabs button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
.tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.filters { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r); padding: 8px 10px; margin-bottom: 8px; }
.filters select, .filters input[type=search] { font: inherit; font-size: 13px; color: var(--text); background: var(--card2);
  border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; max-width: 100%; }
.filters input[type=search] { flex: 1 1 140px; min-width: 0; }
.filters label { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.catpick { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; width: 100%; }
.catpick .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.catpick button { border: 1px solid var(--line); background: var(--card2); border-radius: 6px; padding: 2px 7px; font-size: 12px; font-weight: 700; }
.catpick button[aria-pressed="true"] { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.catpick .clear { color: var(--muted); font-weight: 500; background: none; border: none; }
.summary { font-size: 12px; color: var(--muted); margin: 2px 2px 6px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; background: var(--card);
  border: 1px solid var(--line); }
.tbl th { position: sticky; top: var(--top, 52px); z-index: 2; background: var(--card2); font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); font-weight: 700; padding: 6px 4px; text-align: right; cursor: pointer; user-select: none; white-space: nowrap; border-bottom: 1px solid var(--line); }
.tbl th.l, .tbl td.l { text-align: left; }
.tbl th[aria-sort] { color: var(--accent); }
.tbl th[aria-sort="descending"]::after { content: " ▾"; } .tbl th[aria-sort="ascending"]::after { content: " ▴"; }
.tbl td { padding: 5px 4px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tr.row { cursor: pointer; }
.tbl tr.row:hover td { background: var(--accent-soft); }
.tbl tr.mine td { background: color-mix(in srgb, var(--accent-soft) 70%, transparent); }
.tbl td.rk { color: var(--muted); width: 1%; }
.tbl td.who { max-width: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; }
.who .nm { font-weight: 650; font-size: 13px; }
.who .sb { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; }
.own { font-size: 10.5px; font-weight: 700; padding: 0 5px; border-radius: 4px; margin-left: 4px; }
.own.fa { color: var(--good); box-shadow: inset 0 0 0 1px var(--good); } .own.me { color: #fff; background: var(--accent); }
.own.tm { color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.v { font-weight: 700; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.z2 { background: color-mix(in srgb, var(--good) 30%, transparent); } .z1 { background: var(--good-soft); }
.zm1 { background: var(--bad-soft); } .zm2 { background: color-mix(in srgb, var(--bad) 28%, transparent); }
.strip { display: inline-flex; gap: 2px; vertical-align: middle; }
.strip { margin-top: 2px; }
.strip i { width: 10px; height: 8px; border-radius: 2px; background: var(--chip-bg); display: inline-block; }
.strip i.z2 { background: var(--good); } .strip i.z1 { background: color-mix(in srgb, var(--good) 45%, transparent); }
.strip i.zm1 { background: color-mix(in srgb, var(--bad) 45%, transparent); } .strip i.zm2 { background: var(--bad); }
.tr-up { color: var(--good); font-size: 11px; } .tr-dn { color: var(--bad); font-size: 11px; }
.b2b { color: var(--warn); font-size: 10.5px; font-weight: 700; }
tr.more td { background: var(--card2); white-space: normal; text-align: left; padding: 8px 10px 10px; font-size: 12.5px; }
.more table { border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
.more table td, .more table th { padding: 2px 8px 2px 0; text-align: right; border: none; font-size: 12px; position: static; background: none; }
.more table th { color: var(--muted); font-weight: 700; font-size: 11px; }
.showmore { display: block; margin: 10px auto; }
.basis { font-size: 11.5px; color: var(--muted); margin: 10px 2px; line-height: 1.45; }
/* trade mode (B6): tap + on rows, the verdict sits in a tray at the bottom */
.tabs .trade { margin-left: auto; }
.tabs .sep { width: 100%; height: 0; }
.nx { color: var(--muted); font-size: 11.5px; }
.tbtn { border: 1px solid var(--line); background: var(--card2); border-radius: 6px; width: 24px; height: 22px; font-weight: 800; padding: 0; line-height: 1; }
.tbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.tray { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 2px solid var(--accent);
  box-shadow: 0 -8px 24px rgba(0,0,0,.25); padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); max-height: 60vh; overflow-y: auto; font-size: 13px; }
.tray .in { max-width: 1400px; margin: 0 auto; }
.tray .side { margin: 2px 0; } .tray .side b { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-right: 4px; }
.tray .pk { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin: 2px 4px 2px 0; background: var(--card2); }
.tray .pk button { border: none; background: none; color: var(--muted); padding: 0 0 0 4px; }
.tray .vd { font-weight: 800; font-size: 14px; margin: 4px 0 2px; } .vd.accept { color: var(--good); } .vd.decline { color: var(--bad); } .vd.close { color: var(--warn); }
.tray .scroll { overflow-x: auto; }
.tray table { border-collapse: collapse; font-variant-numeric: tabular-nums; margin: 4px 0; }
.tray td, .tray th { padding: 1px 7px 1px 0; text-align: right; font-size: 12px; } .tray th { color: var(--muted); font-size: 11px; }
.tray .row2 { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
body.trading .fbfab { display: none; }
body.trading main { padding-bottom: 46vh; }
@media (max-width: 420px) { body .brand .tag { display: inline !important; font-size: 13px; } }
@media (max-width: 760px) { .tbl td, .tbl th { padding-left: 3px; padding-right: 3px; } }
</style>
</head>
<body data-layout="Players" data-view="players">
<header class="topbar"><div class="row1">
  <div class="brand"><h1><a href="../" style="color:inherit;text-decoration:none">Sports HQ</a></h1><span class="tag">Players</span></div>
  <div class="links"><a class="pill" href="../">Home</a><a class="pill hide-sm" href="../picks/">Picks</a>
    <button class="pill icon" data-theme-toggle aria-label="Switch light or dark">◐</button><button class="pill" data-reload>—</button></div>
</div></header>
<main id="main"><p class="note">Loading players…</p></main>
<footer class="foot" data-foot></footer>
<button class="fbfab" data-fb="idea" data-spot="Players page">💬 Feedback</button>
<script src="../lib/core.js"></script>
<script>
"use strict";
(function () {
  const S = SHQ, esc = S.esc, main = document.getElementById("main");
  const KEY = "players-state";
  let data = null, st = load();
  function load() {
    try { return { who: "all", pos: "", health: "", trend: "", g0: 0, g1: 0, cats: [], q: "", sort: "v", dir: -1, lg: "", trade: false, give: [], get: [], more: false, ...JSON.parse(S.get(KEY) || "{}"), open: {}, limit: 150 }; }
    catch { return { who: "all", pos: "", health: "", trend: "", g0: 0, g1: 0, cats: [], q: "", sort: "v", dir: -1, lg: "", trade: false, give: [], get: [], more: false, open: {}, limit: 150 }; }
  }
  const save = () => { const { open, limit, ...keep } = st; S.set(KEY, JSON.stringify(keep)); };
  const sgn = (x, d = 1) => x == null ? "" : (x > 0 ? "+" : "") + Number(x).toFixed(d);
  const zc = z => z >= 1 ? "z2" : z >= 0.3 ? "z1" : z <= -1 ? "zm2" : z <= -0.3 ? "zm1" : "";
  const statTxt = (c, v) => v == null ? "–" : /%$/.test(c) ? Number(v).toFixed(3).replace(/^0/, "") : Number(v).toFixed(1);
  const RISE = 5;   // minutes, last 3 games vs before (the radar's MIN_JUMP)

  function leagues() { return Object.keys(data?.leagues || {}); }
  function cur() {
    const names = leagues();
    const hash = decodeURIComponent(location.hash.slice(1));
    const byHash = names.find(n => S.slug(n) === hash);
    if (byHash) st.lg = byHash;
    if (!names.includes(st.lg)) st.lg = names[0];
    return data.leagues[st.lg];
  }
  function fit(L, p) { return st.cats.reduce((t, c) => t + (p.z[L.cats.indexOf(c)] ?? 0), 0); }
  function rows(L) {
    const q = st.q.trim().toLowerCase();
    return L.players.filter(p =>
      (st.who === "all" || (st.who === "fa" ? !p.own : st.who === "mine" ? p.own === "me" : p.own && p.own !== "me")) &&
      (!st.pos || p.pos.split("/").includes(st.pos)) &&
      (!st.health || (st.health === "ok" ? !p.out : !!p.inj)) &&
      (!st.trend || (st.trend === "up" ? (p.dmin ?? 0) >= RISE : (p.dmin ?? 0) <= -RISE)) &&
      p.g[0] >= st.g0 && p.g[1] >= st.g1 &&
      (!st.cats.length || fit(L, p) > 0) &&
      (!q || p.name.toLowerCase().includes(q) || (p.team || "").toLowerCase() === q));
  }
  function sortVal(L, p, k) {
    if (k === "fit") return fit(L, p);
    if (k.startsWith("c")) return p.z[+k.slice(1)];
    return { v: p.v, wk: p.wk, g0: p.g[0], g1: p.g[1], min: p.min, dmin: p.dmin ?? -99, pct: p.pct, name: p.name }[k];
  }
  function ownTag(p) {
    if (p.own === "me") return `<span class="own me">yours</span>`;
    if (!p.own) return `<span class="own fa">FA</span>`;
    return `<span class="own tm" title="${esc(p.own)}">${esc(p.own.length > 12 ? p.own.slice(0, 11) + "…" : p.own)}</span>`;
  }
  function trendTxt(p) {
    if (p.dmin == null) return "";
    return p.dmin >= RISE ? `<span class="tr-up">▲${Math.round(p.dmin)}</span>` : p.dmin <= -RISE ? `<span class="tr-dn">▼${Math.round(-p.dmin)}</span>` : "";
  }
  function detail(L, p) {
    const src = p.src === "season" ? `this season's averages (${p.gp} games)` : `ESPN's season projection (${p.gp} game${p.gp === 1 ? "" : "s"} played so far)`;
    const owner = p.own === "me" ? "yours" : p.own ? p.own : "free agent";
    const cats = `<table><tr><th></th>${L.cats.map(c => `<th>${esc(c)}</th>`).join("")}</tr>
      <tr><th>per game</th>${L.cats.map((c, i) => `<td>${statTxt(c, p.st[i])}</td>`).join("")}</tr>
      <tr><th>value (z)</th>${L.cats.map((c, i) => `<td class="${zc(p.z[i])}">${sgn(p.z[i])}</td>`).join("")}</tr></table>`;
    return `<b>${esc(p.name)}</b> · ${esc(p.pos)} ${esc(p.team)}${p.age ? ` · age ${Math.floor(p.age)}` : ""} · ${esc(owner)}${p.inj ? ` · <b class="bad">${esc(p.inj)}</b>` : ""}<br>
      Value ${sgn(p.v)} per game (#${p.rk}) · this week ${sgn(p.wk)} (${p.g[0]} game${p.g[0] === 1 ? "" : "s"} left${p.out ? ", out" : ""}; ${p.g[1]} next week${p.b2b ? `, ${p.b2b} back-to-back${p.b2b > 1 ? "s" : ""}` : ""})<br>
      ${p.min} min${p.dmin != null ? ` (last 3 games ${sgn(p.dmin)} vs before)` : ""} · ${p.pct}% rostered on ESPN · from ${src}
      ${cats}<a href="https://www.espn.com/nba/player/gamelog/_/id/${esc(p.id)}" target="_blank" rel="noopener">ESPN game log</a>`;
  }
  // ---------- trade checker: the same verdict as shq/nba_trade.py trade() ----------
  function tradeCalc(L, give, get) {
    const t = L.trade || { weights: [], dynasty: false };
    const sum = (xs, f) => xs.reduce((a, p) => a + f(p), 0);
    const now = sum(get, p => p.above || 0) - sum(give, p => p.above || 0);
    const cats = L.cats.map((c, i) => sum(get.filter(p => p.above > 0), p => p.z[i]) - sum(give.filter(p => p.above > 0), p => p.z[i]));
    const w = t.weights?.length ? t.weights : cats.map(() => 1);
    const fit = now + cats.reduce((a, c, i) => a + (w[i] - 1) * c, 0);
    const dyn = t.dynasty ? sum(get, p => p.dyn || 0) - sum(give, p => p.dyn || 0) : null;
    const score = dyn ?? fit;
    return { now, fit, dyn, cats, verdict: Math.abs(score) < 0.5 ? "close" : score > 0 ? "accept" : "decline" };
  }
  function trayHTML(L) {
    const ids = Object.fromEntries(L.players.map(p => [p.id, p]));
    const give = st.give.map(i => ids[i]).filter(Boolean), get = st.get.map(i => ids[i]).filter(Boolean);
    const dynasty = !!L.trade?.dynasty;
    const chip = p => `<span class="pk">${esc(p.name)} <span class="muted">${sgn(dynasty ? p.dyn : p.above)}</span><button data-pick="${esc(p.id)}" aria-label="Remove">✕</button></span>`;
    const side = (label, xs, hint) => `<div class="side"><b>${label}</b>${xs.length ? xs.map(chip).join("") : `<span class="muted">${hint}</span>`}</div>`;
    let body = "";
    if (give.length && get.length) {
      const r = tradeCalc(L, give, get), n = Object.keys(L.trade?.profiles || {}).length, rk = L.trade?.ranks || [];
      const word = { accept: "Accept", decline: "Decline", close: "Coin flip" }[r.verdict];
      const head = dynasty ? `${word} for dynasty: ${sgn(r.dyn)} (now ${sgn(r.now)}/g, fit ${sgn(r.fit)})` : `${word}: ${sgn(r.now)} value/g, fit to your needs ${sgn(r.fit)}`;
      const order = L.cats.map((c, i) => i).sort((a, b) => r.cats[b] - r.cats[a]);
      const named = i => `${esc(L.cats[i])} ${sgn(r.cats[i])}${rk[i] ? ` (you're ${rk[i]} of ${n})` : ""}`;
      const up = order.filter(i => r.cats[i] >= 0.3).slice(0, 3).map(named), down = order.filter(i => r.cats[i] <= -0.3).reverse().slice(0, 3).map(named);
      const spots = get.length - give.length;
      const table = `<div class="scroll"><table><tr><th></th>${L.cats.map(c => `<th>${esc(c)}</th>`).join("")}</tr>
        <tr><th>change</th>${r.cats.map(c => `<td class="${zc(c)}">${sgn(c)}</td>`).join("")}</tr>
        <tr><th>your rank</th>${rk.map(x => `<td>${x}</td>`).join("")}</tr></table></div>`;
      const spotTxt = spots ? `; ${Math.abs(spots)} roster spot${Math.abs(spots) > 1 ? "s" : ""} ${spots > 0 ? "to open (drop your worst, about 0)" : "freed for a waiver pickup (about 0)"}` : "";
      const dynTxt = dynasty ? " Dynasty: value on a rough age curve (under 24 grows, 29 and up fades) plus a prospect bonus under 23; not fitted to data." : "";
      body = `<div class="vd ${r.verdict}">${esc(head)}</div>
        <div>${up.length ? "Helps " + up.join(", ") : "Helps no category much"}${down.length ? " · hurts " + down.join(", ") : ""}</div>
        ${st.more ? table + `<p class="basis">Value per game above a waiver-level player (one below that would be dropped anyway, so he counts 0)${spotTxt}. Fit weighs your weakest categories more and ones you already win less.${dynTxt} Ideas only: nothing is sent.</p>` : ""}`;
    }
    return `<div class="tray"><div class="in">
      ${side("Give", give, "tap + on your players")}${side("Get", get, "tap + on theirs")}${body}
      <div class="row2"><span class="muted">${give.length && get.length ? "" : "Pick at least one player on each side."}</span>
        <span>${give.length && get.length ? `<button class="pill" data-tmore>${st.more ? "Less" : "Details"}</button> ` : ""}<button class="pill" data-tclear>Clear</button> <button class="pill" data-trade>Done</button></span></div></div></div>`;
  }
  // ---------- tabs: basketball leagues, then football ----------
  function tabsHTML() {
    const names = leagues(), kind = n => data.leagues[n].kind || "nba";
    return names.map((n, i) => (i && kind(n) !== kind(names[i - 1]) ? `<span class="sep"></span>` : "")
      + `<button data-lg="${esc(n)}" aria-pressed="${n === st.lg}">${esc(n)}</button>`).join("");
  }
  // ---------- football: rest-of-season and this-week ranks by position (shq/nfl_players.py) ----------
  const NFL_POS = ["QB", "RB", "WR", "TE", "K", "DEF"], NFL_SORT = ["ros", "proj", "exp", "fc", "name"];
  // ESPN experts' consensus rank (shq/experts.py): green/red when they rank him far better/worse than our week rank
  const EXP_BIG = { QB: 6, TE: 6, RB: 10, WR: 10 };
  const expCls = p => { if (!p.exp_wk || !p.proj_rk) return ""; const g = p.proj_rk - p.exp_wk, b = EXP_BIG[p.pos] || 10;
    return g >= b ? "pos" : -g >= b ? "neg" : ""; };
  function renderNFL(L) {
    document.body.classList.remove("trading");
    document.documentElement.style.setProperty("--top", (document.querySelector(".topbar")?.offsetHeight || 52) + "px");
    if (!NFL_SORT.includes(st.sort)) { st.sort = "ros"; st.dir = -1; }
    const pos = NFL_POS.includes(st.pos) ? st.pos : "", q = st.q.trim().toLowerCase();
    const all = L.players.filter(p =>
      (st.who === "all" || (st.who === "fa" ? !p.own : st.who === "mine" ? p.own === "me" : p.own && p.own !== "me")) &&
      (!pos || p.pos === pos) && (!st.health || (st.health === "ok" ? !p.inj : !!p.inj)) &&
      (!q || p.name.toLowerCase().includes(q) || (p.team || "").toLowerCase() === q));
    const val = (p, k) => k === "name" ? p.name : k === "exp" ? (p.exp_wk ? -p.exp_wk : p.exp_lately ? -500 - p.exp_lately : null) : k === "ros" ? (p.ros ?? (p.pos === "K" || p.pos === "DEF" ? p.proj : null)) : p[k];
    all.sort((a, b) => { const x = val(a, st.sort), y = val(b, st.sort);
      return typeof x === "string" ? st.dir * x.localeCompare(y) : st.dir * ((x ?? -1e9) - (y ?? -1e9)); });
    const shown = all.slice(0, st.limit), wide = !matchMedia("(max-width: 760px)").matches, W = x => wide ? x : "";
    const ncol = 7 + (wide ? 3 : 0);
    const opt = (v, t, cur) => `<option value="${v}"${String(cur) === String(v) ? " selected" : ""}>${t}</option>`;
    const n1 = x => x == null ? "–" : Number(x).toFixed(1);
    const rk = (p, k) => p[k + "_rk"] ? `${p.pos}${p[k + "_rk"]}` : "–";
    const filters = `<div class="filters">
      <input type="search" data-f="q" placeholder="Name or team (DAL)" value="${esc(st.q)}" aria-label="Search">
      <select data-f="who" aria-label="Who">${opt("all", "Everyone", st.who)}${opt("fa", "Available", st.who)}${opt("mine", "Mine", st.who)}${opt("taken", "Other teams", st.who)}</select>
      <select data-f="pos" aria-label="Position">${opt("", "All pos", pos)}${NFL_POS.map(x => opt(x, x, pos)).join("")}</select>
      <select data-f="health" aria-label="Health">${opt("", "Any health", st.health)}${opt("ok", "No injury tag", st.health)}${opt("inj", "Injury tag", st.health)}</select></div>`;
    const head = `<tr>${th("ros", "Rk", "", "Rest-of-season rank at his position")}${th("name", "Player", "l")}
      ${th("ros", "ROS", "", "Rest of season: projected points per game (next 4 weeks, byes skipped)")}${th("proj", "Wk", "", "This week's projection")}
      <th title="This week's rank at his position">Wk rk</th>${th("exp", "Experts", "", "ESPN experts' consensus rank at his position this week")}${W(`<th title="ESPN experts' median rank over their last 3 weekly ranks">Exp lately</th>`)}${W(th("fc", "Value", "", "FantasyCalc value"))}${W(`<th class="l" title="Next 4 weeks' projections">Next 4</th>`)}</tr>`;
    const body = shown.map(p => {
      const sub = `${p.pos} · ${esc(p.team)}${p.opp ? " · " + esc(p.opp) : ""}${p.kick && p.opp !== "BYE" ? " " + esc(S.kick(p.kick)) : ""}`;
      const tr = `<tr class="row${p.own === "me" ? " mine" : ""}" data-id="${esc(p.id)}"><td class="rk">${rk(p, "ros")}</td>
        <td class="who l"><div class="nm">${esc(p.name)}${ownTag(p)}${p.inj ? ` <span class="chip ${/OUT|IR|D/.test(p.inj) ? "bad" : "q"}">${esc(p.inj)}</span>` : ""}</div><div class="sb">${sub}</div></td>
        <td class="v">${n1(p.ros)}</td><td>${p.opp === "BYE" ? "bye" : n1(p.proj)}</td><td>${rk(p, "proj")}</td><td class="${expCls(p)}" title="${p.exp_range ? `range ${p.exp_range[0]}-${p.exp_range[1]}, ${p.exp_range[2]} experts` : ""}">${p.exp_wk ? p.pos + p.exp_wk : "–"}</td>${W(`<td>${p.exp_lately ? p.pos + p.exp_lately : "–"}</td>`)}
        ${W(`<td>${p.fc ? Number(p.fc).toLocaleString("en-US") : "–"}</td><td class="l nx">${(p.next || []).map(x => x == null ? "bye" : n1(x)).join(" · ")}</td>`)}</tr>`;
      const more = st.open[p.id] ? `<tr class="more"><td colspan="${ncol}"><b>${esc(p.name)}</b> · ${esc(p.pos)} ${esc(p.team)} · ${p.own === "me" ? "yours" : p.own ? esc(p.own) : "free agent"}${p.inj ? ` · <b class="bad">${esc(p.inj)}</b>` : ""}<br>
        Rest of season ${n1(p.ros)} per game (${rk(p, "ros")}) · this week ${p.opp === "BYE" ? "bye" : `${n1(p.proj)} (${rk(p, "proj")})`}${p.opp && p.opp !== "BYE" ? `, ${esc(p.opp)} ${esc(S.kick(p.kick))}` : ""}<br>
        Next 4 weeks: ${(p.next || []).map(x => x == null ? "bye" : n1(x)).join(" · ") || "–"} · FantasyCalc ${p.fc ? Number(p.fc).toLocaleString("en-US") : "–"}<br>
        ESPN experts: ${p.exp_wk ? `${p.pos}${p.exp_wk} this week${p.exp_range ? ` (their ranks ${p.exp_range[0]}-${p.exp_range[1]}, ${p.exp_range[2]} experts)` : ""}` : "this week's ranks not out"}${p.exp_lately ? ` · ${p.pos}${p.exp_lately} lately` : ""}</td></tr>` : "";
      return tr + more;
    }).join("");
    main.innerHTML = `<div class="tabs">${tabsHTML()}</div>${filters}
      <div class="summary"><span>${all.length} player${all.length === 1 ? "" : "s"}${all.length > shown.length ? `, showing ${shown.length}` : ""} · week ${L.week} · tap a row for his full line</span>
        <span>Built ${esc(S.kick(data.nflUpdated || data.updated))}</span></div>
      <table class="tbl"><thead>${head}</thead><tbody>${body || `<tr><td colspan="${ncol}" class="l muted">No player matches these filters.</td></tr>`}</tbody></table>
      ${all.length > shown.length ? `<button class="pill showmore" data-more>Show ${Math.min(150, all.length - shown.length)} more</button>` : ""}
      <p class="basis">${esc(L.basis)} Ideas only: nothing is sent.</p>`;
    const sel = main.querySelector(`[data-f="q"]`);
    if (focusQ) { sel.focus(); sel.setSelectionRange(sel.value.length, sel.value.length); focusQ = false; }
  }
  function th(k, label, cls = "", title = "") {
    const s = st.sort === k ? ` aria-sort="${st.dir < 0 ? "descending" : "ascending"}"` : "";
    return `<th class="${cls}" data-sort="${k}"${s}${title ? ` title="${esc(title)}"` : ""}>${label}</th>`;
  }
  function render() {
    if (!data?.leagues || !leagues().length) { main.innerHTML = `<p class="note">No player values yet. They fill in on the next cloud run.</p>`; return; }
    const L = cur();
    if (L.kind === "nfl") return renderNFL(L);
    document.documentElement.style.setProperty("--top", (document.querySelector(".topbar")?.offsetHeight || 52) + "px");
    if (st.sort === "fit" && !st.cats.length) st.sort = "v";
    if (/^c\d+$/.test(st.sort) && +st.sort.slice(1) >= L.cats.length) st.sort = "v";
    const all = rows(L), dir = st.dir;
    all.sort((a, b) => { const x = sortVal(L, a, st.sort), y = sortVal(L, b, st.sort);
      return typeof x === "string" ? dir * x.localeCompare(y) : dir * ((x ?? -1e9) - (y ?? -1e9)) || a.rk - b.rk; });
    const shown = all.slice(0, st.limit);
    const tabs = tabsHTML() + `<button class="trade" data-trade aria-pressed="${st.trade}">⇄ Trade check</button>`;
    document.body.classList.toggle("trading", st.trade);
    const opt = (v, t, cur) => `<option value="${v}"${String(cur) === String(v) ? " selected" : ""}>${t}</option>`;
    const filters = `<div class="filters">
      <input type="search" data-f="q" placeholder="Name or team (PHX)" value="${esc(st.q)}" aria-label="Search">
      <select data-f="who" aria-label="Who">${opt("all", "Everyone", st.who)}${opt("fa", "Available", st.who)}${opt("mine", "Mine", st.who)}${opt("taken", "Other teams", st.who)}</select>
      <select data-f="pos" aria-label="Position">${opt("", "All pos", st.pos)}${["PG", "SG", "SF", "PF", "C"].map(x => opt(x, x, st.pos)).join("")}</select>
      <select data-f="health" aria-label="Health">${opt("", "Any health", st.health)}${opt("ok", "Healthy", st.health)}${opt("inj", "Injured", st.health)}</select>
      <select data-f="trend" aria-label="Minutes">${opt("", "Any minutes", st.trend)}${opt("up", "Rising min", st.trend)}${opt("down", "Falling min", st.trend)}</select>
      <label>G this wk ≥<select data-f="g0">${[0, 1, 2, 3, 4].map(x => opt(x, x, st.g0)).join("")}</select></label>
      <label>next ≥<select data-f="g1">${[0, 1, 2, 3, 4].map(x => opt(x, x, st.g1)).join("")}</select></label>
      <div class="catpick"><span class="lbl">Helps in:</span>${L.cats.map(c => `<button data-cat="${esc(c)}" aria-pressed="${st.cats.includes(c)}">${esc(c)}</button>`).join("")}
        ${st.cats.length ? `<button class="clear" data-cat="">clear</button>` : ""}</div></div>`;
    // phone: key columns and a category heat strip under each name; the per-category numbers open with the row
    const wide = !matchMedia("(max-width: 760px)").matches, W = x => wide ? x : "";
    const ncol = 5 + (st.cats.length ? 1 : 0) + (wide ? 2 + L.cats.length : 0);
    const catCols = W(L.cats.map((c, i) => th("c" + i, esc(c), "", `${c} per game; sorts by its value`)).join(""));
    const head = `<tr>${th("v", "#", "", "Rank by value per game")}${th("name", "Player", "l")}${st.cats.length ? th("fit", "Fit", "", "Sum of the chosen categories' value") : ""}
      ${th("v", "Val", "", "Value per game (z-scores, league categories)")}${th("wk", "Wk", "", "This week: value above a waiver-level player × games left")}
      ${th("g0", "G", "", "Games left this week · next week")}${W(th("min", "Min", "", "Minutes per game; ▲▼ last 3 games vs before"))}${catCols}
      ${W(th("pct", "Ros%", "", "% rostered on ESPN"))}</tr>`;
    const inDeal = p => st.give.includes(p.id) || st.get.includes(p.id);
    const pickBtn = p => `<button class="tbtn" data-pick="${esc(p.id)}" aria-pressed="${inDeal(p)}" aria-label="Add to the trade">${inDeal(p) ? "✓" : "+"}</button>`;
    const body = shown.map(p => {
      const strip = wide ? "" : `<span class="strip">${L.cats.map((c, i) => `<i class="${zc(p.z[i])}" title="${esc(c)} ${sgn(p.z[i])}"></i>`).join("")}</span>`;
      const tr = `<tr class="row${p.own === "me" ? " mine" : ""}" data-id="${esc(p.id)}"><td class="rk">${st.trade && p.own ? pickBtn(p) : p.rk}</td>
        <td class="who l"><div class="nm">${esc(p.name)}${ownTag(p)}${p.inj ? ` <span class="chip ${p.out ? "bad" : "q"}">${esc(p.inj === "Day-To-Day" ? "DTD" : p.inj)}</span>` : ""}</div>
          <div class="sb">${esc(p.pos)} · ${esc(p.team)}${p.src === "proj" ? " · proj" : ""} ${wide ? "" : trendTxt(p)}</div>${strip}</td>
        ${st.cats.length ? `<td class="v">${sgn(fit(L, p))}</td>` : ""}
        <td class="v ${p.v >= 0 ? "pos" : "neg"}">${sgn(p.v)}</td><td class="${p.wk > 0 ? "pos" : p.wk < 0 ? "neg" : ""}">${sgn(p.wk)}</td>
        <td>${p.g[0]}·${p.g[1]}${p.b2b ? ` <span class="b2b" title="back-to-backs">b2b</span>` : ""}</td>
        ${W(`<td>${p.min.toFixed(0)} ${trendTxt(p)}</td>` + L.cats.map((c, i) => `<td class="${zc(p.z[i])}">${statTxt(c, p.st[i])}</td>`).join("")
            + `<td>${Math.round(p.pct)}</td>`)}</tr>`;
      return tr + (st.open[p.id] ? `<tr class="more"><td colspan="${ncol}">${detail(L, p)}</td></tr>` : "");
    }).join("");
    main.innerHTML = `<div class="tabs">${tabs}</div>${filters}
      <div class="summary"><span>${all.length} player${all.length === 1 ? "" : "s"}${all.length > shown.length ? `, showing ${shown.length}` : ""}${st.cats.length ? ` who help ${esc(st.cats.join(" + "))} on balance (Fit)` : ""} · tap a row for his full line</span>
        <span>Values built ${esc(S.kick(data.updated))}</span></div>
      <table class="tbl"><thead>${head}</thead><tbody>${body || `<tr><td colspan="${ncol}" class="l muted">No player matches these filters.</td></tr>`}</tbody></table>
      ${all.length > shown.length ? `<button class="pill showmore" data-more>Show ${Math.min(150, all.length - shown.length)} more</button>` : ""}
      <p class="basis">${esc(L.basis)} Cells are shaded by value: green helps, red hurts. Ratio categories (FG%, FT%) count attempts too.
        Ideas only: nothing is sent to ESPN.</p>${st.trade ? trayHTML(L) : ""}`;
    const sel = main.querySelector(`[data-f="q"]`);
    if (focusQ) { sel.focus(); sel.setSelectionRange(sel.value.length, sel.value.length); focusQ = false; }
  }
  let focusQ = false;
  main.addEventListener("click", e => {
    const t = e.target;
    const lg = t.closest("[data-lg]");
    if (lg) { st.lg = lg.dataset.lg; st.cats = []; st.give = []; st.get = []; st.limit = 150; st.pos = ""; history.replaceState(null, "", "#" + S.slug(st.lg)); save(); return render(); }
    if (t.closest("[data-trade]")) { st.trade = !st.trade; save(); return render(); }
    if (t.closest("[data-tclear]")) { st.give = []; st.get = []; save(); return render(); }
    if (t.closest("[data-tmore]")) { st.more = !st.more; save(); return render(); }
    const pk = t.closest("[data-pick]");
    if (pk) {
      const id = pk.dataset.pick, p = cur().players.find(x => x.id === id), side = p?.own === "me" ? "give" : "get";
      st[side] = st[side].includes(id) ? st[side].filter(x => x !== id) : [...st[side], id];
      save(); return render();
    }
    const c = t.closest("[data-cat]");
    if (c) { const k = c.dataset.cat; st.cats = !k ? [] : st.cats.includes(k) ? st.cats.filter(x => x !== k) : [...st.cats, k];
      if (st.cats.length) { st.sort = "fit"; st.dir = -1; } save(); return render(); }
    const h = t.closest("th[data-sort]");
    if (h) { const k = h.dataset.sort; st.dir = st.sort === k ? -st.dir : k === "name" ? 1 : -1; st.sort = k; save(); return render(); }
    if (t.closest("[data-more]")) { st.limit += 150; return render(); }
    const r = t.closest("tr.row");
    if (r && !t.closest("a")) { st.open[r.dataset.id] = !st.open[r.dataset.id]; render(); }
  });
  main.addEventListener("change", e => {
    const f = e.target.dataset.f;
    if (!f || f === "q") return;
    st[f] = /^g\d$/.test(f) ? +e.target.value : e.target.value; st.limit = 150; save(); render();
  });
  main.addEventListener("input", e => { if (e.target.dataset.f === "q") { st.q = e.target.value; focusQ = true; save(); render(); } });
  addEventListener("hashchange", () => data && render());
  matchMedia("(max-width: 760px)").addEventListener("change", () => data && render());
  S.start(async () => {
    const [nba, nfl] = await Promise.all([S.loadFile("players"), S.loadFile("players_nfl")]);
    if (nba || nfl) data = { updated: nba?.updated || nfl?.updated, nflUpdated: nfl?.updated,
                             leagues: { ...(nba?.leagues || {}), ...(nfl?.leagues || {}) } };
    render();
  });
})();
</script>
</body>
</html>
