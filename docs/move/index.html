<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Try a move · Sports HQ</title>
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../lib/core.css">
<style>
/* Try a move + Ask Claude for any league (Q-054): the same box as on each league page (lib/move.js), full screen. */
main { padding: 12px 16px 80px; max-width: 860px; margin: 0 auto; }
.lgs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 12px; }
.lgs button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.lgs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow); }
.box h2 { font-size: 17px; margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.box h2 a { font-size: 12.5px; font-weight: 600; }
.intro { font-size: 13px; color: var(--muted); margin: 0 2px 10px; }
</style>
</head>
<body data-layout="Try a move" data-view="move">
<header class="topbar"><div class="row1">
  <div class="brand"><h1><a href="../" style="color:inherit;text-decoration:none">Sports HQ</a></h1><span class="tag">Try a move</span></div>
  <div class="links"><a class="pill" href="../">Home</a><a class="pill hide-sm" href="../players/">Players</a><a class="pill hide-sm" href="../war-room-v2/">War Room</a>
    <button class="pill icon" data-theme-toggle aria-label="Switch light or dark">◐</button><button class="pill" data-reload>—</button></div>
</div></header>
<main id="main"><p class="note">Loading…</p></main>
<footer class="foot" data-foot></footer>
<button class="fbfab" data-fb="idea" data-spot="Try a move page">💬 Feedback</button>
<script src="../lib/core.js"></script>
<script>
"use strict";
const { esc } = SHQ;
let cur = null, shown = null;
function render(d) {
  const names = Object.keys(d.lineups?.leagues || {}).filter(n => !d.lineups.leagues[n].pending);
  const fromHash = names.find(n => SHQ.slug(n) === decodeURIComponent(location.hash.slice(1)));
  cur = fromHash || (names.includes(cur) ? cur : names[0]);
  const main = document.getElementById("main");
  if (shown === cur && main.querySelector(".mv-host")) return;   // the 5-minute refresh keeps what you typed
  shown = cur;
  const lg = d.lineups.leagues[cur];
  main.innerHTML = `<p class="intro">Pick a league, then a player to add and one to drop: the verdict shows at once, from the same numbers as the league page${lg?.advice?.guillotine ? " and the War Room's own model" : ""}. Ask Claude underneath for news and gut calls.</p>
    <div class="lgs" role="group" aria-label="League">${names.map(n => `<button data-lg="${esc(n)}" aria-pressed="${n === cur}">${esc(n)}</button>`).join("")}</div>
    <section class="box"><h2>${esc(cur)} <a href="../#lg=${encodeURIComponent(cur)}">League page &rarr;</a></h2><div class="mv-host" data-mv="${esc(cur)}"></div></section>`;
}
document.getElementById("main").addEventListener("click", e => {
  const b = e.target.closest("[data-lg]");
  if (!b) return;
  history.replaceState(null, "", "#" + SHQ.slug(b.dataset.lg));
  cur = b.dataset.lg; shown = null; render(SHQ.data);
});
addEventListener("hashchange", () => { shown = null; render(SHQ.data); });
SHQ.start(render);
</script>
</body>
</html>
